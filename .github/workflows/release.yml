# yaml-language-server: $schema=../../schemas/github-workflow.schema.json
name: Release connector
on:
  workflow_dispatch:
    inputs:
      tag:
        description: New vMAJOR.MINOR.PATCH release tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm bench:restoration:offline
      - name: Build release assets
        run: pnpm build
      - name: Verify committed distribution
        run: git diff --exit-code -- dist
      - name: Prepare draft release from main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release create "$RELEASE_TAG" .output/release/nscloud-nx-cache-action.mjs .output/release/token.mjs .output/release/SHA256SUMS .output/release/LICENSE .output/release/NOTICE .output/release/THIRD_PARTY_LICENSES.txt --draft --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes 'Nx loopback cache connector with local archives and Namespace Artifact Storage.'
