# yaml-language-server: $schema=../../schemas/github-workflow.schema.json
name: Failed job Artifact persistence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  failed-writer:
    runs-on: ${{ format('{0};overrides.cache-tag=nx-cache-integration', vars.NAMESPACE_RUNNER_PROFILE || 'namespace-profile-linux-default') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: corepack enable
      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: pnpm
          path: ~/.cache/nx-archives
      - run: pnpm install --frozen-lockfile
      - name: Finalize an artifact before intentional job failure
        env:
          NX_ARTIFACT_PREFIX: nx-cache/failure/${{ github.run_id }}
        run: |
          pnpm exec tsx scripts/namespace-roundtrip.ts write
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: failed-writer
          path: results/
  reader:
    needs: failed-writer
    if: always() && needs.failed-writer.result == 'failure'
    runs-on: ${{ format('{0};overrides.cache-tag=nx-cache-integration', vars.NAMESPACE_RUNNER_PROFILE || 'namespace-profile-linux-default') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Restore finalized artifact in a later fresh job
        env:
          NX_ARTIFACT_PREFIX: nx-cache/failure/${{ github.run_id }}
        run: pnpm exec tsx scripts/namespace-roundtrip.ts verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: failure-reader
          path: results/
